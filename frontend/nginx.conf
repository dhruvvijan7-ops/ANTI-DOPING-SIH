server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API: same-origin so no CORS is needed. The browser calls /api/v1 here;
    # nginx forwards it to the VERITY backend container.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets: long client-side caching (hashed by Vite).
    location ~* \.(?:js|css|svg|png|jpe?g|gif|webp|woff2?|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA fallback: every unknown path serves index.html so client-side
    # routes (/intelligence, /investigations/...) work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}